name: Refactor shared experience positioning

on:
  push:
    branches:
      - agent/shared-experience-positioning-component

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/shared-experience-positioning-component
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply shared-component refactor
        run: node scripts/refactor-shared-experience-positioning.cjs

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit completed refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use shared experience positioning component"
          git push origin HEAD:agent/shared-experience-positioning-component
